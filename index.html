<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bachateca</title>
<meta name="description" content="Bachateca: tu biblioteca de figuras de bachata, con enlaces y repaso para no quedarte en blanco en el social.">
<meta name="theme-color" content="#071330" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f6ff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bachateca">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Diseño: app nativa de iOS. Título grande por pestaña, listas agrupadas con separadores finos,
   barras translúcidas arriba y abajo, hojas con asa. Tipografía del sistema (SF Pro / SF Pro Rounded),
   sin fuentes externas para que funcione sin conexión. Elemento propio: la marca de 8 tiempos
   (el 4 y el 8, los «taps» de la bachata, resaltados). */
:root{
  /* Paleta: azul, blanco y verde fosforito */
  --bg:#f3f6ff; --surface:#ffffff; --surface2:#e8eeff; --line:#d3dcf2; --fill:rgba(30,94,255,.08);
  --fg:#0a1a3f; --muted:#5b6b8f;
  --accent:#1e5eff; --accent-ink:#ffffff; --accent-fg:#1a4fd8; --accent-soft:rgba(30,94,255,.10);
  --neon:#c4f838; --neon-ink:#0a1a3f; --chip-on:#c4f838; --chip-on-ink:#0a1a3f;
  --st-espera:#56637f; --st-practica:#1a4fd8; --st-disponible:#3d6600; --st-consolidada:#0a1a3f;
  --warn:#d70015;
  --bar:rgba(243,246,255,.84);
  --toast-act:#c4f838;
  --f-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#071330; --surface:#0f2150; --surface2:#18306b; --line:#264383; --fill:rgba(120,160,255,.16);
    --fg:#ffffff; --muted:#a3b5dc;
    --accent:#c4f838; --accent-ink:#071330; --accent-fg:#c4f838; --accent-soft:rgba(196,248,56,.12);
    --neon:#c4f838; --neon-ink:#071330; --chip-on:#ffffff; --chip-on-ink:#071330;
    --st-espera:#8a9bbf; --st-practica:#6fb6ff; --st-disponible:#c4f838; --st-consolidada:#ffffff;
    --warn:#ff6b7a;
    --bar:rgba(7,19,48,.80);
    --toast-act:#1e5eff;
    color-scheme:dark;
  }
}
/* Social se usa en una sala oscura: siempre con la paleta de noche, aunque el sistema esté en claro. */
:root.night{
  --bg:#071330; --surface:#0f2150; --surface2:#18306b; --line:#264383; --fill:rgba(120,160,255,.16);
  --fg:#ffffff; --muted:#a3b5dc;
  --accent:#c4f838; --accent-ink:#071330; --accent-fg:#c4f838; --accent-soft:rgba(196,248,56,.12);
  --neon:#c4f838; --neon-ink:#071330; --chip-on:#ffffff; --chip-on-ink:#071330;
  --st-espera:#8a9bbf; --st-practica:#6fb6ff; --st-disponible:#c4f838; --st-consolidada:#ffffff;
  --warn:#ff6b7a;
  --bar:rgba(7,19,48,.80);
  --toast-act:#1e5eff;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
::placeholder{color:var(--muted);opacity:1}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
img,video{max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

/* barra superior translúcida */
header.top{position:sticky;top:0;z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:36px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.logo{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.logo i{display:none}
.mark{width:26px;height:26px;display:block;border-radius:7px}
.mk-a{fill:var(--fg)} .mk-b{fill:var(--st-practica)} .mk-n{fill:var(--neon)}
.sync{display:none}
.bar .btn,.bar .icon-btn{flex-shrink:0;white-space:nowrap}
.ltitle{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.005em;line-height:1.1;margin:14px 0 2px}

/* botones */
.btn{border:0;background:var(--fill);color:var(--fg);border-radius:12px;padding:11px 16px;font-weight:600;font-size:16px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--accent-fg)}
.btn.sm{padding:7px 12px;font-size:15px;min-height:34px;border-radius:10px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%}
.btn:active{opacity:.7}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;font-size:17px;color:var(--fg)}
.bar .btn.pri{border-radius:99px;min-height:34px;padding:6px 14px;font-size:15px}

/* barra de pestañas translúcida */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(-1 * var(--nav-shift, 0px));z-index:25;display:grid;grid-template-columns:repeat(4,1fr);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
nav.tabs button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;color:var(--muted);font-size:11px;font-weight:600;min-height:50px}
nav.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent-fg)}
nav.tabs .badge{position:absolute;top:3px;left:calc(50% + 7px)}
.badge{background:var(--neon);color:var(--neon-ink);border-radius:99px;font-size:12px;font-weight:600;padding:0 6px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums;line-height:18px}

/* tipografía */
section.view{padding-top:8px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:800;letter-spacing:0;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:17px;font-weight:600;color:var(--fg);margin:0;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* resumen */
/* resumen del repertorio: una línea bajo el título, sin competir con las figuras */
.sum{margin:-14px 2px 0;font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}
.sum b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.sum .lnk{border:0;background:none;padding:0;font-size:15px;font-weight:600;color:var(--accent-fg);min-height:32px}
.sum .lnk b{color:inherit}

/* formularios */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .full{grid-column:1/-1}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--surface);border:0;border-radius:12px;padding:11px 14px;min-width:0;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=search]{background:var(--fill)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.sheet input[type=text],.sheet select,.sheet textarea{background-color:var(--surface)}
.panel input[type=text],.panel select,.panel textarea{background-color:var(--surface2)}
select:has(> option[value=""]:checked){color:var(--muted)}
textarea{resize:vertical;min-height:76px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:500;min-width:0}

/* listas agrupadas */
.list,.group{display:flex;flex-direction:column;gap:0}
.group-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px}
.group-h b{font-family:var(--f-display);font-weight:800;font-size:20px}
.group-h span{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{position:relative;background:var(--surface);border:0;border-radius:0;padding:12px 36px 12px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;color:var(--fg)}
button.card::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--line);border-top:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
button.card:active{background:var(--surface2)}
.list>.card:first-child,.group>.group-h+.card,.group>.card:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
.list>.card:last-child,.group>.card:last-child{border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
.list>.card+.card::before,.group>.card+.card::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.panel .list>.card{background:var(--surface2)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.route .arrow{color:var(--accent-fg);font-weight:700}
.hold{opacity:.85}
.fname{font-weight:600;font-size:17px;color:var(--fg);line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-espera{color:var(--st-espera)}.st-practica{color:var(--st-practica)}.st-disponible{color:var(--st-disponible)}.st-consolidada{color:var(--st-consolidada)}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--fill);color:var(--muted);font-weight:500}
.tag.warn{color:var(--warn)}
.empty{background:var(--surface);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill);border-radius:99px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--fg)}
.chip.sm{padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.chip.warn{box-shadow:inset 0 0 0 1.5px var(--warn)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.6;margin-left:5px}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.note.ok{background:color-mix(in srgb,var(--st-disponible) 14%,transparent)}
.note .btn{margin-top:8px}
.cov{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;font-size:15px}
.cov .h{font-size:13px;color:var(--muted)}
.cov .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.practice{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:6px;padding-top:16px;border-top:.5px solid var(--line)}
.practice .chain{align-self:stretch}
.panel .graph{padding:0;background:none}
.chain{display:flex;flex-direction:column}
.chain .step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:.5px solid var(--line)}
.chain .step:first-child{border-top:0}
.chain .k{font-family:var(--f-display);font-weight:800;color:var(--accent-fg);font-variant-numeric:tabular-nums}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px}
.seg2 button{background:none;border:0;border-radius:8px;padding:7px;font-size:14px;font-weight:600;color:var(--fg)}
.seg2 button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* repaso */
.flash{background:var(--surface);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.12}
.answer{border-top:.5px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.exits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.exits li{display:flex;flex-direction:column;font-size:16px}
.exits li .to{font-size:14px;color:var(--muted)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{padding:12px 6px;font-size:15px}
.progress{height:4px;background:var(--fill);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

/* social */
.social-pos{padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);position:relative}
.social-pos:first-child{border-radius:var(--r) var(--r) 0 0}
.social-pos:last-child{border-radius:0 0 var(--r) var(--r)}
.social-pos:only-child{border-radius:var(--r)}
.social-pos+.social-pos::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.social-pos .p{font-family:var(--f-display);font-weight:800;font-size:24px}
.social-pos ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.social-pos li{font-size:19px;display:flex;flex-direction:column}
.social-pos li .to{font-size:14px;color:var(--muted)}
.social-pos li.dim{opacity:.5}
.block-btn{width:100%;padding:18px;font-size:19px;border-radius:18px;font-family:var(--f-display);font-weight:800;position:sticky;bottom:calc(70px - var(--nav-shift, 0px) + env(safe-area-inset-bottom,0px));z-index:5}
/* filas de Social: se tocan para marcar «salió» */
.sf{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:4px 0;border:0;background:none;color:var(--fg);text-align:left}
.sf .t{display:flex;flex-direction:column;flex:1;min-width:0}
.sf .n{font-size:19px}
.sf .to{font-size:14px;color:var(--muted)}
.sf.dim .t{opacity:.5}
.sf .ck{flex:none;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center}
.sf .ck svg{width:14px;height:14px;fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.sf[aria-pressed="true"] .ck{background:var(--accent);box-shadow:none}
.sf[aria-pressed="true"] .ck svg{opacity:1}
/* panel «Me he bloqueado» */
.bk-head{display:flex;flex-direction:column;gap:6px}
.bk-head h2{font-size:30px}
.bk-head b{color:var(--fg);font-weight:600}
.bk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk-tile{min-height:72px;border:0;border-radius:var(--r);background:var(--surface);color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.15;padding:12px 14px;text-align:left}
.bk-tile:active{background:var(--surface2)}
.bk-from{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;color:var(--muted)}
.bk-from:focus{outline:none}
.bk-exits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.bk-exits li{display:flex;flex-direction:column;gap:4px}
.bk-exits b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.15}
.bk-exits span{font-size:17px;color:var(--muted)}
.bk-exits .sg{color:var(--fg)}
.bk-body{margin-top:auto;display:flex;flex-direction:column;gap:16px}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-start;gap:22px;padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow-y:auto}

/* hojas */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out}
.sheet{overscroll-behavior:contain;background:var(--bg);border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:94%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .34s cubic-bezier(.2,.9,.25,1)}
.sheet::before{content:"";flex:none;width:36px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{margin-right:auto;font-size:22px}
.sheet-head h2:focus,.flash .big:focus{outline:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:0;background:var(--fill);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.seg.neutral button{color:var(--fg)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,currentColor 18%,var(--surface));box-shadow:inset 0 0 0 1.5px currentColor}
.seg.neutral button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);box-shadow:none}
details summary{cursor:pointer;color:var(--accent-fg);font-weight:600;font-size:16px;padding:4px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";font-weight:700}
details[open] summary::before{content:"− "}
details[open] summary{margin-bottom:12px}
details .inner{display:flex;flex-direction:column;gap:12px}
.vidbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r);padding:12px}
.vidbox video,.player video{width:100%;max-height:58vh;border-radius:10px;background:#000;display:block}
.trim{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trim div{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.trim b{color:var(--fg);font-variant-numeric:tabular-nums;font-size:17px;font-family:var(--f-display)}
.vprog{font-size:15px;color:var(--accent-fg);font-weight:600}
.player{display:flex;flex-direction:column;gap:8px}
.player video.mirror{transform:scaleX(-1)}
.pctl{display:flex;gap:6px;flex-wrap:wrap}
.pctl button{border:0;background:var(--fill);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.pctl button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.graph,.chart{margin:0;display:flex;flex-direction:column;gap:8px}
.graph{background:var(--surface);border-radius:var(--r);padding:12px}
.graph svg,.chart svg{width:100%;height:auto;max-width:100%;display:block}
.graph figcaption{padding:0 4px}
.g-edge{fill:none;stroke-width:1.8}
.g-ready{stroke:var(--st-disponible)}
.g-prac{stroke:var(--muted);stroke-dasharray:4 3}
.g-head-r{fill:var(--st-disponible)} .g-head-p{fill:var(--muted)}
.g-node{cursor:pointer}
.g-node rect{fill:var(--surface2);stroke:var(--line);stroke-width:1.2}
.g-node text{fill:var(--fg);font:600 14px var(--f-body)}
.g-node text.long{font-size:12px}
.g-gap rect{stroke:var(--warn);stroke-width:1.6}
.g-sel rect{fill:var(--chip-on);stroke:var(--chip-on)} .g-sel text{fill:var(--chip-on-ink)}
.g-lbl{fill:var(--muted);font:600 13px var(--f-body)}
.c-grid{stroke:var(--line);stroke-width:1}
.c-ax{fill:var(--muted);font:500 12px var(--f-body);font-variant-numeric:tabular-nums}
.c-bar{fill:color-mix(in srgb,var(--st-disponible) 45%,var(--surface))}
.c-sel{fill:var(--st-disponible)}
.c-hit{fill:transparent;cursor:pointer}
.dtab{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;width:100%}
.dtab th,.dtab td{padding:6px 8px;border-bottom:.5px solid var(--line);text-align:right}
.dtab th:first-child,.dtab td:first-child{text-align:left}
.coach{white-space:pre-wrap;font-size:15px;line-height:1.5;background:var(--surface2);border-radius:12px;padding:12px 14px}
.card.has-thumb{display:grid;grid-template-columns:60px 1fr;column-gap:12px;align-items:center}
.card.has-thumb .card-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;background:var(--surface2);display:block}
details.info{font-size:14px;color:var(--muted)}
details.info summary{color:var(--muted);font-weight:500;font-size:14px;padding:2px 0}
details.info summary::before{content:"ⓘ ";font-weight:400}
details.info[open] summary::before{content:"ⓘ "}
details.info[open] summary{margin-bottom:6px}
.sheet.dragging{transition:none!important}
.sheet.snap{transition:transform .25s cubic-bezier(.2,.9,.25,1)}
.toast .undo{background:none;border:0;color:var(--toast-act);font-weight:700;margin:-10px -8px -10px 8px;padding:10px 8px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px - var(--nav-shift, 0px) + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.poslist{display:flex;flex-direction:column;gap:0;border-radius:12px;overflow:hidden}
.poslist>div{display:flex;align-items:center;gap:4px;background:var(--surface2);padding:6px 6px 6px 14px;position:relative;min-height:46px}
.poslist>div+div::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.poslist span.nm{margin-right:auto;min-width:0;overflow-wrap:break-word}
.ib{width:36px;height:36px;flex:none;border:0;border-radius:10px;background:none;color:var(--accent-fg);display:grid;place-items:center}
.ib:disabled{opacity:.3}.ib.danger{color:var(--warn)}.ib:active{background:var(--fill)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.sheet-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));z-index:3;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-24px - env(safe-area-inset-bottom,0px));padding:12px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);flex-wrap:nowrap}
.log{background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.log .d{grid-column:1/-1;font-size:13px;color:var(--muted)}
/* Compás de 8: la frase de bachata, con los taps (4 y 8) más altos, los tiempos que ocupa
   la figura rellenos y un punto en el tiempo en que empieza. */
.cmp{display:inline-flex;align-items:flex-end;gap:2px;height:13px;vertical-align:-1px;position:relative}
.cmp i{display:block;width:4px;height:7px;border-radius:1px;background:var(--line);position:relative;font-style:normal}
.cmp i.tap{height:13px}
.cmp i.on{background:var(--accent-fg)}
.cmp i.st::after{content:"";position:absolute;left:50%;bottom:-5px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--fg)}
.cmp b{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px;line-height:1}
.cmp.lg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:auto;width:100%;max-width:340px;align-items:end;vertical-align:baseline}
.cmp.lg i{width:auto;height:auto;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.cmp.lg i::before{content:"";display:block;width:100%;height:16px;border-radius:4px;background:var(--line)}
.cmp.lg i.tap::before{height:28px}
.cmp.lg i.on::before{background:var(--accent-fg)}
.cmp.lg i.st::after{display:none}
.cmp.lg i span{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cmp.lg i.tap span{color:var(--fg)}
.cmp.lg i.st span{background:var(--fg);color:var(--bg)}
.cmp-cap{font-size:14px;color:var(--muted);margin-top:6px}
.cmp-row{display:flex;flex-direction:column;gap:8px}
/* zona táctil de al menos 44 pt en controles pequeños, sin cambiar su aspecto */
.icon-btn,.ib,.chip,.btn.sm,.bar .btn.pri,.toast .undo,.sum .lnk{position:relative}
.icon-btn::after,.ib::after,.btn.sm::after,.bar .btn.pri::after,.sum .lnk::after{content:"";position:absolute;inset:-6px -3px}
.chip::after{content:"";position:absolute;inset:-7px -3px}
/* texto solo para VoiceOver */
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
/* errores junto al campo */
.field-err{color:var(--warn);font-size:14px;font-weight:500;margin:-8px 2px 0}
[aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--warn)}
.del-row{background:var(--surface);margin-top:4px}
.bk-st.due{color:var(--warn)}
/* confirmación: hoja de acción de iOS */
.confirm-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;padding:0 max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));animation:fade .2s ease-out}
.confirm{width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;animation:up .3s cubic-bezier(.2,.9,.25,1)}
.confirm .grp{background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.confirm .msg{padding:16px 20px 14px;text-align:center;display:flex;flex-direction:column;gap:4px}
.confirm .msg b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.confirm .msg span{font-size:14px;color:var(--muted)}
.confirm button{border:0;background:var(--surface);min-height:56px;padding:12px 16px;font-size:19px;color:var(--accent-fg)}
.confirm .grp button{border-top:.5px solid var(--line)}
.confirm button.danger{color:var(--warn)}
.confirm .cancel{border-radius:var(--r);font-weight:600}
.confirm button:active{background:var(--surface2)}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.kv{grid-template-columns:96px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <div class="brand"><img class="mark" src="icon-192.png" alt="" width="26" height="26"><span class="logo">bachateca</span></div>

      <button class="btn pri sm" id="btn-new">+ Añadir</button>

</div>

<nav class="tabs" role="tablist" aria-label="Secciones">

  <button role="tab" data-tab="enlazar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.3 11l9.4-4M7.3 13l9.4 4"/></svg><span>Enlazar</span></button>
  <button role="tab" data-tab="social"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span>Social</span></button>

<div id="sheet-root"></div>
<div id="overlay-root"></div>
<div id="confirm-root"></div>
<div id="sr-live" class="sr" aria-live="polite"></div>

<script>

(() => {
"use strict";
// ---------- constantes ----------
const DEFAULT_POS = ["Cerrada","Abierta 2 manos","Abierta 1 mano","Mano cruzada","Sombra","Hammerlock"];
const DEFAULT_HOLDS = ["Abrazo","Dos manos","Dos manos cruzadas","Izq–der","Der–der","Izq–izq","Der–izq","Sin manos"];
const DEFAULT_CLASSES = ["Oscar e Inés · Parejas 1","Oscar e Inés · Salsa en línea","Cris y Argenis","Brotons · Parejas 1","Brotons · Parejas 2","Brotons · Footwork"];
const ESTADOS = [
  {k:"espera", t:"Lista de espera", d:"Capturada, aún no la llevo al social"},
  {k:"practica", t:"En práctica", d:"La recuerdo pensando o con el vídeo"},
  {k:"disponible", t:"Disponible", d:"La recupero y guío cómoda en el social"},
  {k:"consolidada", t:"Consolidada", d:"Con distintas parejas y canciones, sé salir"}
];
const EST = Object.fromEntries(ESTADOS.map(e=>[e.k,e]));
const TIPOS = [{k:"figura",t:"Figura"},{k:"transicion",t:"Transición"},{k:"footwork",t:"Footwork"},{k:"styling",t:"Styling"}];
const TIPO = Object.fromEntries(TIPOS.map(e=>[e.k,e]));
const DURS = ["4","8","16","24","32"];
const LADDER = [1,3,7,14,30,60];
const LS_LOCAL = "compas.v1";          // datos del modo «Solo aquí» (y versiones antiguas)
const LS_CACHE = "compas.cache.v2";    // copia de la cuenta para abrir sin cobertura
const LS_DIRTY = "compas.dirty.v2";    // cambios pendientes de subir
const LS_MIGR  = "compas.migr.v2";     // aviso de migración resuelto
const MAX_SESSION = 5;
const PROMOTE_DISP = 2;   // usos en socials para proponer «Disponible»
const PROMOTE_CONS = 6;   // usos para proponer «Consolidada»

// ---------- estado ----------
let S = { figures:{}, logs:{}, positions:[...DEFAULT_POS], holds:[...DEFAULT_HOLDS], classes:[...DEFAULT_CLASSES], linkRep:{} };
let mode = null;          // "cloud" | "local"
let refs = null;
let tab = "repertorio";
let filt = { q:"", baile:"todos", estado:"todos", vista:"pos" };
let linkPos = null, linkHold = "";
let chain = null;
let session = null;
let socialIncl = false;
let wakeLock = null;
let loaded = false;
let assetsApi = null;
let busy = false;
let vstate = null;
// Figuras marcadas como «salió» durante el social: se guardan 12 h por si se cierra la app a mitad de noche.
const LS_SAL = "bachateca.salieron";
let logSel = new Set((()=>{ const s=lsGet(LS_SAL); return s && Date.now()-s.t < 432e5 && Array.isArray(s.ids) ? s.ids : []; })());
const saveSel = () => lsSet(LS_SAL, {t:Date.now(), ids:[...logSel]});
let blockPos = null;
let logSuggest = [];
let editKey = null, confirmKey = null;
let migrateN = 0, migrateData = null;
let sampleApi = null, sampleImages = 0;
let sheetBase = null;       // estado de la hoja al abrirla, para saber si hay cambios sin guardar
let confirmDone = null;     // hoja de confirmación abierta
let backupNudge = false;    // recordar la copia tras registrar un social
let pendingReload = false;  // versión nueva esperando a que se cierre la hoja
const BK_AT = "bachateca.backup.at", BK_CH = "bachateca.backup.ch";
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";
const MAX_UPLOAD = 19.5*1024*1024;
const vidUrl = id => "/_blob/" + id;
const fmtT = t => { t=Math.max(0,t||0); const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); };
const fmtMB = b => (b/1048576).toFixed(b<10485760?1:0).replace(".",",")+" MB";

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayStr = (off=0) => { const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+off); return d.toISOString().slice(0,10); };
const fmtDate = s => { try { return new Date(s+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"}); } catch { return s; } };
const clone = o => JSON.parse(JSON.stringify(o));
const arrOr = (a,d) => Array.isArray(a)&&a.length ? [...a] : [...d];
const figs = () => Object.values(S.figures).sort((a,b)=> (b.creado||0)-(a.creado||0));
const tipoOf = f => f.tipo || "figura";
const moveTipo = t => t==="figura" || t==="transicion";
const isMove = f => moveTipo(tipoOf(f));
const placed = f => isMove(f) && !!f.entrada && !!f.salida;
const incomplete = f => isMove(f) && (!f.entrada || !f.salida);
const active = f => f.estado !== "espera";
const ready = f => f.estado==="disponible" || f.estado==="consolidada";
const holdOk = (a,b) => !a || !b || a===b;
const canFollow = (p,n) => n.entrada===p.salida && holdOk(p.agarreOut, n.agarreIn);
const exitsFrom = (pos, hold, excl) => figs().filter(f=> f.id!==excl && active(f) && placed(f) && f.entrada===pos && holdOk(hold, f.agarreIn));
const arrivals = pos => figs().filter(f=> active(f) && placed(f) && f.salida===pos);
const extraPositions = () => [...new Set(figs().flatMap(f=>[f.entrada,f.salida]).filter(Boolean))].filter(p=>!S.positions.includes(p));
const allPositions = () => [...S.positions, ...extraPositions()];
const isDue = f => active(f) && (!f.rep || !f.rep.due || f.rep.due <= todayStr());
const dueFigs = () => figs().filter(isDue).sort((a,b)=>(a.rep?.due||"").localeCompare(b.rep?.due||"") || (a.rep?.step||0)-(b.rep?.step||0));
const linkPositions = () => allPositions().filter(p=>exitsFrom(p).length);
const dueLinks = () => { const t=todayStr(); return linkPositions().filter(p=>{ const r=S.linkRep[p]; return !r || !r.due || r.due<=t; }); };
let toastT;
function toast(msg, action){
  let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=msg;
  if(action){ const b=document.createElement("button"); b.type="button"; b.className="undo"; b.textContent=action.label; b.onclick=()=>{ t.hidden=true; clearTimeout(toastT); action.fn(); }; t.appendChild(b); }
  t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; if(action && action.onExpire) action.onExpire(); }, action ? 10000 : 2400);
}
// Avisos para VoiceOver sin cambiar la pantalla.
const announce = m => { const r=$("#sr-live"); if(!r) return; r.textContent=""; setTimeout(()=>{ r.textContent=m; }, 60); };
// Hoja de acción para confirmar (descartar, borrar). Devuelve true si se confirma.
function askConfirm({title, msg="", ok, cancel="Cancelar"}){
  if(confirmDone) confirmDone(false);
  return new Promise(res=>{
    const prev=document.activeElement;
    $("#confirm-root").innerHTML = `<div class="confirm-bg" data-cf="no"><div class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cf-t"${msg?' aria-describedby="cf-m"':""}>
      <div class="grp"><div class="msg"><b id="cf-t">${esc(title)}</b>${msg?`<span id="cf-m">${esc(msg)}</span>`:""}</div>
      <button type="button" class="danger" data-cf="ok">${esc(ok)}</button></div>
      <button type="button" class="cancel" data-cf="no">${esc(cancel)}</button></div></div>`;
    confirmDone = v=>{ confirmDone=null; $("#confirm-root").innerHTML=""; if(prev && prev.isConnected) prev.focus({preventScroll:true}); res(v); };
    $("#confirm-root .cancel").focus();
  });
}
// ---------- cambios sin guardar en las hojas ----------
const pressSig = () => [...document.querySelectorAll("#sheet-root [data-tipo],#sheet-root [data-est],#sheet-root [data-cls]")].map(b=>b.getAttribute("aria-pressed")==="true"?1:0).join("");
const vSig = () => vstate ? `${vstate.file?vstate.file.size:0}/${vstate.remove?1:0}` : "";
const fieldDirty = el => {
  if(el.tagName==="SELECT"){ const i=[...el.options].findIndex(o=>o.defaultSelected); return el.selectedIndex !== (i<0?0:i); }
  if(el.type==="checkbox") return el.checked !== el.defaultChecked;
  return el.value !== el.defaultValue;
};
function markClean(carried){ sheetBase = {press:pressSig(), v:vSig(), carried:!!carried}; }
function sheetDirty(){
  if(!$(".sheet") || !sheetBase) return false;
  if(sheetBase.carried) return true;
  if([...document.querySelectorAll("#sheet-root input:not([type=file]),#sheet-root select,#sheet-root textarea")].some(fieldDirty)) return true;
  return pressSig()!==sheetBase.press || vSig()!==sheetBase.v;
}
async function requestClose(){
  if(confirmDone) return;
  if(!busy && sheetDirty() && !(await askConfirm({title:"¿Descartar los cambios?", msg:"Lo que has cambiado en esta hoja no se ha guardado.", ok:"Descartar cambios", cancel:"Seguir editando"}))) return;
  confirmKey=null; editKey=null; closeSheet();
}
// ---------- copia de seguridad ----------
function backupInfo(){
  const at=+lsGet(BK_AT)||0, ch=+lsGet(BK_CH)||0;
  const real=figs().filter(f=>!f.ejemplo), logs=Object.values(S.logs);
  const nf=real.filter(f=>(f.creado||0)>at).length, nl=logs.filter(l=>(l.creado||0)>at).length;
  const days=at ? Math.floor((Date.now()-at)/864e5) : null;
  const has=real.length>0 || logs.length>0;
  return {at, days, nf, nl, ch, has, stale: has && (!at || (ch>0 && days>=7))};
}
function backupStatus(b){
  if(!b.at) return {main: b.has ? "Aún no has hecho ninguna copia." : "Aún no hay nada que copiar.", since:""};
  const when = b.days===0 ? "hoy" : b.days===1 ? "ayer" : `hace ${b.days} días`;
  const parts=[];
  if(b.nf) parts.push(`${b.nf} ${b.nf===1?"figura nueva":"figuras nuevas"}`);
  if(b.nl) parts.push(`${b.nl} ${b.nl===1?"social registrado":"socials registrados"}`);
  return {main:`Última copia: ${when}.`, since: parts.length ? `Desde entonces: ${parts.join(" y ")}.` : (b.ch ? "Desde entonces has hecho cambios." : "Sin cambios desde entonces.")};
}
async function exportBackup(){
  const ok = await shareOrDownload(new File([exportData()], `bachateca-${todayStr()}.json`, {type:"application/json"}));
  if(!ok) return;
  lsSet(BK_AT, Date.now()); lsSet(BK_CH, 0); toast("Copia exportada");
  if($('[aria-label="Ajustes"]')) openSettings(); else if($('[aria-label="Registrar el social"]')) openLog();
}
function nextRep(r0,g){
  const r=Object.assign({step:0,aciertos:0,fallos:0}, r0||{});
  if(g==="no"){ r.step=0; r.due=todayStr(1); r.fallos++; }
  else if(g==="dudas"){ r.due=todayStr(Math.max(1, Math.floor(LADDER[r.step]/2))); }
  else { r.step=Math.min(r.step+1, LADDER.length-1); r.due=todayStr(LADDER[r.step]); r.aciertos++; }
  r.last=todayStr(); return r;
}

// ---------- almacenamiento (en este dispositivo) ----------
function applyData(c){
  S = { figures:c.figures||{}, logs:c.logs||{}, positions:arrOr(c.positions,DEFAULT_POS), holds:arrOr(c.holds,DEFAULT_HOLDS),
        classes:Array.isArray(c.classes)?[...c.classes]:[...DEFAULT_CLASSES], linkRep:(c.linkRep&&typeof c.linkRep==="object")?c.linkRep:{} };
}
function lsGet(k){ try { const r=localStorage.getItem(k); return r?JSON.parse(r):null; } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const LS_FALLBACK = "bachateca.v1";
let idb = null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("sin IndexedDB"));
    const r=indexedDB.open("bachateca",1);

const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
// En la app instalada, algunos iPhone dejan el área visible más corta que la pantalla y la barra
// de pestañas queda flotando por encima del borde. Se mide la diferencia y se baja la barra hasta abajo.
let screenDiag = "";
const APP_VERSION = "1.12";
let probeB=null, probeI=null, lastGap=0;
function fixBottom(){
  let shift = 0;
  try{
    if(!probeB){
      probeB=document.createElement("div"); probeB.style.cssText="position:fixed;left:0;bottom:0;width:1px;height:1px;visibility:hidden;pointer-events:none";
      probeI=document.createElement("div"); probeI.style.cssText="position:fixed;top:0;left:0;height:env(safe-area-inset-top,0px);width:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none";
      document.body.append(probeB, probeI);
    }
    const portrait = window.innerHeight > window.innerWidth;
    const sh = Math.max(screen.width, screen.height);
    // Dónde acaba de verdad un elemento fijado abajo. iOS a veces lo deja antes del borde y
    // lo corrige solo más tarde, así que se vuelve a medir tras cada cambio.
    const fixedBottom = probeB.getBoundingClientRect().bottom;
    const gap = Math.round(sh - fixedBottom);
    const ins = probeI.getBoundingClientRect();
    // Tope de seguridad: como mucho se baja lo que mide la zona del indicador de inicio,
    // así los iconos y sus nombres nunca quedan fuera de la pantalla.
    const cap = Math.round(ins.width);
    if(isStandalone() && portrait && gap > 0 && gap < 140) shift = Math.min(gap, cap);
    lastGap = gap;
    screenDiag = `v${APP_VERSION} · pantalla ${sh} · visible ${window.innerHeight} · borde ${Math.round(fixedBottom)} · márgenes ${Math.round(ins.height)}/${Math.round(ins.width)} · ajuste ${shift}${isStandalone()?" · instalada":" · Safari"}`;
  }catch{}
  const v = shift + "px";
  if(document.documentElement.style.getPropertyValue("--nav-shift") !== v) document.documentElement.style.setProperty("--nav-shift", v);
}

    const h = Array.isArray(f.hist) ? [...f.hist] : (Array.isArray(prev.hist) ? [...prev.hist] : [{e:prev.estado, d:dayOf(prev.creado)}]);

  }

}

// Compás de 8 de una figura: qué tiempos de la frase ocupa y en cuál empieza.
function compasTxt(f){
  const t=+f.tiempo||0, n=+f.tiempos||0;

function compas(f, big){

  const start=t||1, on=new Set();

  const reps = n>8 ? Math.round(n/8) : 0;
  const cells=[1,2,3,4,5,6,7,8].map(b=>`<i class="${b%4===0?"tap ":""}${on.has(b)?"on ":""}${t===b?"st":""}">${big?`<span>${b}</span>`:""}</i>`).join("");

function nextFrom(f){
  const opts = figs().filter(x=>x.id!==f.id && active(x) && placed(x) && canFollow(f,x)).slice(0,3);
  if(!opts.length) return `<p class="small muted">Desde ${esc(f.salida)}${f.agarreOut?` (${esc(f.agarreOut)})`:""} aún no tienes otra figura. Vuelve al básico.</p>`;

}
function grade(g){
  if(session.kind==="link"){
    const p=session.ids[session.i];
    S.linkRep[p]=nextRep(S.linkRep[p], g); persist({t:"lr"});
    if(exitsFrom(p).length<2) session.weak.push(p);
  } else {
    const f = S.figures[session.ids[session.i]]; if(!f) return;
    f.rep = nextRep(f.rep, g); S.figures[f.id]=f; persist({t:"fig",id:f.id});
    if(g==="fluida" && f.estado==="practica" && f.rep.step>=2) session.promote.push(f.id);
  }
  session.done.push(g); session.i++; session.revealed=false;
  render(); focusReview();
}

}
function startSession(kind, any){

  const shuffle = a => a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  if(kind==="link") ids = any ? shuffle(linkPositions()).slice(0,3) : dueLinks().slice(0,MAX_SESSION);
  else ids = any ? shuffle(figs().filter(active)).slice(0,3).map(f=>f.id) : dueFigs().slice(0,MAX_SESSION).map(f=>f.id);
  session = {kind, ids, i:0, revealed:false, done:[], promote:[], weak:[]};
  render();
}

function makeChain(start){
  const pool = figs().filter(f=>active(f)&&placed(f));
  const steps=[]; const used=new Set(); let prev=null;
  let pos = start || (pool[Math.floor(Math.random()*pool.length)]||{}).entrada;
  for(let i=0;i<4;i++){
    const opts = pool.filter(f=>!used.has(f.id) && (prev ? canFollow(prev,f) : f.entrada===pos));
    if(!opts.length){ steps.push({dead: prev?prev.salida:pos, hold: prev?prev.agarreOut:""}); break; }
    const f = opts[Math.floor(Math.random()*opts.length)];
    used.add(f.id); steps.push({f}); prev=f;
  }
  return {steps};
}
function renderChain(){
  if(!chain.steps.length) return `<p class="muted small">No hay figuras activas para encadenar.</p>`;
  let n=0;
  return `<div class="chain">${chain.steps.map(s=> s.dead
    ? `<div class="step"><span class="k">↺</span><div><b>Básico</b><div class="small muted">Desde ${esc(s.dead)}${s.hold?` (${esc(s.hold)})`:""} no tienes más salidas. Vuelve al básico: es una transición válida.</div></div></div>`
    : `<div class="step"><span class="k">${++n}</span><div><b>${esc(s.f.nombre)}</b><div class="small muted">${esc(s.f.entrada)}${s.f.agarreIn?` (${esc(s.f.agarreIn)})`:""} → ${esc(s.f.salida)}${s.f.agarreOut?` (${esc(s.f.agarreOut)})`:""}${s.f.senal?` · ${esc(s.f.senal)}`:""}</div></div></div>`).join("")}</div>`;
}

// Miniatura: un fotograma del inicio de la figura, pequeño (≈ 8 KB) para guardarlo con los datos.
async function makeThumb(v, t){
  if(!(v.readyState>=2)) await new Promise((res,rej)=>{ const ok=()=>res(); v.addEventListener("loadeddata",ok,{once:true}); v.addEventListener("error",()=>rej(new Error("vídeo")),{once:true}); setTimeout(()=>rej(new Error("tiempo")),12000); });
  const dur=isFinite(v.duration)?v.duration:0; const at=Math.min(Math.max(0,(t||0)+0.4), Math.max(0,dur-0.1));
  if(Math.abs(v.currentTime-at)>0.05) await new Promise(res=>{ let d=false; const ok=()=>{ if(d) return; d=true; res(); }; v.addEventListener("seeked",ok,{once:true}); v.currentTime=at; setTimeout(ok,3000); });
  const W=v.videoWidth, H=v.videoHeight; if(!W||!H) return null;
  const side=Math.min(W,H), c=document.createElement("canvas"); c.width=c.height=160;
  const ctx=c.getContext("2d"); ctx.drawImage(v,(W-side)/2,(H-side)/2,side,side,0,0,160,160);
  if(frameIsBlank(ctx)) return null;
  return c.toDataURL("image/jpeg",0.72);
}
function frameIsBlank(ctx){
  try{ const d=ctx.getImageData(0,0,160,160).data; let sum=0, n=0; for(let i=0;i<d.length;i+=4*97){ sum+=d[i]+d[i+1]+d[i+2]; n++; } return sum/(n*3) < 6; }catch{ return false; }
}
// Crea las miniaturas que falten (figuras con vídeo guardadas antes de esta función) en segundo plano.
let thumbsRunning=false;
async function genMissingThumbs(){
  if(thumbsRunning || !idb) return; thumbsRunning=true;
  try{
    for(const f of Object.values(S.figures).filter(x=>x.vid && !x.thumb)){
      const url=await vidObjUrl(f.vid).catch(()=>null); if(!url) continue;
      const v=document.createElement("video");
      v.muted=true; v.defaultMuted=true; v.playsInline=true; v.setAttribute("playsinline",""); v.setAttribute("muted",""); v.preload="auto"; v.src=url;
      v.style.cssText="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1";
      document.body.appendChild(v);
      try{
        try{ await v.play(); await new Promise(r=>{ const ok=()=>r(); v.addEventListener("timeupdate",ok,{once:true}); setTimeout(ok,2500); }); }catch{}
        v.pause();
        const th=await makeThumb(v,(f.vidTrim&&f.vidTrim.start)||0);
        if(th && S.figures[f.id] && !S.figures[f.id].thumb){ S.figures[f.id].thumb=th; persist({t:"fig",id:f.id}); render(); }
      }catch{} finally{ v.removeAttribute("src"); v.load(); v.remove(); }
    }
  } finally { thumbsRunning=false; }
}
function playerHTML(f){

function backfillThumb(vidId, v){
  const f=Object.values(S.figures).find(x=>x.vid===vidId && !x.thumb); if(!f) return;
  try{
    const W=v.videoWidth, H=v.videoHeight; if(!W||!H) return;
    const side=Math.min(W,H), c=document.createElement("canvas"); c.width=c.height=160;
    const ctx=c.getContext("2d"); ctx.drawImage(v,(W-side)/2,(H-side)/2,side,side,0,0,160,160);
    if(frameIsBlank(ctx)) return;
    f.thumb=c.toDataURL("image/jpeg",0.72); persist({t:"fig",id:f.id});
    if(vstate && vstate.figId===f.id) vstate.thumb=f.thumb;
  }catch{}
}
function hydrateVideos(root){
  (root||document).querySelectorAll("video[data-vid]:not([data-h])").forEach(async v=>{
    v.dataset.h="1"; const id=v.dataset.vid, s=+v.dataset.s||0, e=+v.dataset.e||0;
    const url=await vidObjUrl(id).catch(()=>null);
    if(!url){ const p=v.closest(".player"); if(p) p.innerHTML=`<p class="small muted">Este vídeo no está en este dispositivo.</p>`; return; }
    v.addEventListener("loadedmetadata",()=>{ if(s>0) try{ v.currentTime=s; }catch{} });
    v.addEventListener("seeked",()=>backfillThumb(id, v), {once:true});
    v.addEventListener("playing",()=>setTimeout(()=>backfillThumb(id, v),300));
    v.addEventListener("loadeddata",()=>{ if(!(s>0)) backfillThumb(id, v); }, {once:true});
    v.addEventListener("timeupdate",()=>{ if(e>0 && v.currentTime>=e){ const loop=v.closest(".player")?.dataset.loop==="1"; v.currentTime=s; if(!loop) v.pause(); } });
    v.addEventListener("play",()=>{ if(v.currentTime<s-0.25 || (e>0 && v.currentTime>=e)) v.currentTime=s; });
    v.src=url;
  });
}
async function shareOrDownload(file){

  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{URL.revokeObjectURL(a.href);}catch{} a.remove(); },4000); return true;
}

// Se llama de forma síncrona en el gesto de guardar: crea el reproductor y el audio
// mientras iOS todavía considera que hay interacción del usuario.
function primeMedia(url){
  const v=document.createElement("video");
  v.playsInline=true; v.setAttribute("playsinline",""); v.preload="auto"; v.src=url;
  v.style.cssText="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1";
  document.body.appendChild(v);
  let actx=null, dest=null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){ actx=new AC(); const src=actx.createMediaElementSource(v); dest=actx.createMediaStreamDestination(); src.connect(dest); actx.resume?.(); }
  }catch{ actx=null; dest=null; }
  const p=v.play(); if(p&&p.then) p.then(()=>v.pause()).catch(()=>{});
  return {v, actx, dest};
}
function cleanupPrime(pr){ try{ pr.v.pause(); pr.v.remove(); }catch{} try{ pr.actx && pr.actx.close(); }catch{} }

async function uploadVideo(vs, prime, onMsg){
  const err = m => { const e=new Error(m); e.userMsg=m; return e; };
  const full = vs.start<=0.05 && (!vs.dur || !vs.end || vs.end>=vs.dur-0.05);
  try{
    if(vs.compact){
      const blob = await compressVideo(vs, prime, onMsg);
      const id=uid(); onMsg("Guardando…"); await vidPut(id, blob);
      return {id, sizeBytes:blob.size, compressed:true, trim:{start:0,end:0}};
    }
    if(vs.fromId) return {id:vs.fromId, sizeBytes:vs.file.size, compressed:false, trim:{start:vs.start, end: full?0:vs.end}};
    onMsg("Guardando vídeo…");
    const id=uid(); await vidPut(id, vs.file);
    return {id, sizeBytes:vs.file.size, compressed:false, trim:{start:vs.start, end: full?0:vs.end}};
  }catch(ex){
    if(ex && ex.userMsg) throw ex;
    throw err("No se pudo guardar el vídeo. Puede que falte espacio: libera espacio o marca «Guardar solo el fragmento».");
  }finally{ cleanupPrime(prime); }
}

async function compressVideo(vs, pr, onMsg){
  const err = (m)=>{ const e=new Error(m); e.userMsg=m; return e; };
  if(typeof MediaRecorder==="undefined") throw err("Este navegador no puede optimizar vídeos. Recórtalo antes en Fotos (Editar) para que ocupe menos de 20 MB.");
  const v=pr.v;
  if(!(v.readyState>=1)) await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>rej(err("No se pudo leer el vídeo.")); });
  const dur = isFinite(v.duration)?v.duration:vs.dur;
  const start = vs.start, end = Math.min(vs.end||dur, dur), seg = end-start;
  if(seg<=0.5) throw err("El fragmento es demasiado corto.");
  if(seg>300) throw err("Para que quepa, recorta el vídeo a 5 minutos como máximo.");
  const cands=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  const mime = cands.find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch{ return false; } });
  if(!mime) throw err("Este navegador no puede optimizar vídeos. Recórtalo antes en Fotos para que ocupe menos de 20 MB.");
  const LIMIT = 19*1048576;
  // Safari no siempre respeta el bitrate pedido: si el tamaño real se dispara, se repite con menos resolución.
  const tiers = [{side:960,fps:30},{side:720,fps:30},{side:540,fps:24},{side:426,fps:20}];
  const srcW=v.videoWidth||960, srcH=v.videoHeight||540;
  const aBits=96000;
  try{ await pr.actx?.resume(); }catch{}
  let lastSize=0;
  for(let ti=0; ti<tiers.length; ti++){
    const tier=tiers[ti], isLast = ti===tiers.length-1;
    const scale=Math.min(1, tier.side/Math.max(srcW,srcH));
    const w=Math.max(2,Math.round(srcW*scale/2)*2), h=Math.max(2,Math.round(srcH*scale/2)*2);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const ctx=cv.getContext("2d");
    const stream=cv.captureStream(tier.fps);
    if(pr.dest){ const at=pr.dest.stream.getAudioTracks()[0]; if(at) stream.addTrack(at); }
    const vBits=Math.round(Math.max(300000, Math.min(2500000, (17*8*1048576)/seg - aBits)) * (tier.side/960));
    const rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:vBits, audioBitsPerSecond:aBits});
    const chunks=[]; let bytes=0;
    rec.ondataavailable=e=>{ if(e.data&&e.data.size){ chunks.push(e.data); bytes+=e.data.size; } };
    const stopped=new Promise(res=>rec.onstop=res);
    v.pause();
    await new Promise(res=>{ v.onseeked=res; v.currentTime=start; setTimeout(res,1500); });
    ctx.drawImage(v,0,0,w,h);
    rec.start(1000);
    try{ await v.play(); }
    catch{ v.muted=true; try{ await v.play(); }catch{ rec.stop(); throw err("El navegador no dejó reproducir el vídeo para optimizarlo. Vuelve a pulsar Guardar."); } }
    const frameGap = 1000/tier.fps; let lastDraw=0;
    const aborted = await new Promise(res=>{
      let done=false, lastCT=-1, lastMove=performance.now();
      const finish=(ab)=>{ if(done) return; done=true; clearInterval(wd); v.pause(); res(ab); };
      // Vigilancia: si el vídeo deja de avanzar 8 s, se para con un mensaje en vez de quedarse colgado.
      const wd=setInterval(()=>{
        if(v.currentTime!==lastCT){ lastCT=v.currentTime; lastMove=performance.now(); }
        else if(performance.now()-lastMove>8000) finish("stall");
        if(v.currentTime>=end || v.ended) finish(false);
      },1000);
      const tick=(now)=>{
        if(done) return;
        const t=performance.now();
        if(t-lastDraw>=frameGap-2){ ctx.drawImage(v,0,0,w,h); lastDraw=t; }
        const el=v.currentTime-start;
        const pct=Math.min(99,Math.round(el/seg*100));
        onMsg(`Optimizando vídeo ${pct} %${ti?` (calidad ${tier.side}p)`:""}… deja la pantalla abierta`);
        // a partir de 4 s, si el ritmo real supera el límite, se reinicia con menos resolución
        if(!isLast && el>4 && bytes>0 && (bytes/el)*seg > LIMIT) return finish(true);
        if(v.currentTime>=end || v.ended) return finish(false);
        if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick); else requestAnimationFrame(tick);
      };
      v.onended=()=>finish(false); tick();
    });
    rec.stop(); await stopped;
    if(aborted==="stall") throw err("El vídeo dejó de avanzar mientras se reducía. Deja la pantalla encendida y la app abierta, y vuelve a pulsar Guardar.");
    if(aborted) continue;
    const blob=new Blob(chunks,{type:mime.split(";")[0]});
    if(!blob.size) throw err("No se pudo optimizar el vídeo en este navegador.");
    lastSize=blob.size;
    if(blob.size<=LIMIT) return blob;
  }
  throw err(`Aun optimizado ocupa ${fmtMB(lastSize)}. Recorta un fragmento más corto (con 30–60 s suele bastar para una figura).`);
}

async function grabFrames(v, start, end, n){
  if(!(v.readyState>=2)) await new Promise((res,rej)=>{ v.onloadeddata=res; v.onerror=()=>rej(new Error("load")); setTimeout(()=>rej(new Error("timeout")),20000); });
  const dur = isFinite(v.duration) ? v.duration : (end||0);
  const a = Math.max(0, start||0), b = Math.max(a+0.5, Math.min(end||dur, dur));
  const W=v.videoWidth||640, H=v.videoHeight||360, sc=Math.min(1, 768/Math.max(W,H));
  const cv=document.createElement("canvas"); cv.width=Math.round(W*sc); cv.height=Math.round(H*sc); const ctx=cv.getContext("2d");
  const out=[];
  for(let i=0;i<n;i++){
    const t = a + (b-a)*(i+0.5)/n;
    await new Promise(res=>{ let ok=false; const done=()=>{ if(ok) return; ok=true; v.removeEventListener("seeked",done); res(); }; v.addEventListener("seeked",done); v.currentTime=t; setTimeout(done,3000); });
    ctx.drawImage(v,0,0,cv.width,cv.height);
    const blob = await new Promise(res=>cv.toBlob(res,"image/jpeg",0.8));
    if(blob) out.push(blob);
  }
  return out;
}

function parseReply(t){

    const m=l.replace(/^[\s*\-•]+/,"").match(/^([^:]{2,30}):\s*(.*)$/); if(!m) return;

function graphHTML(cov){
  const nodes = cov.filter(c=>c.out.length||c.into.length).map(c=>c.p);
  if(nodes.length<2) return "";
  const n=nodes.length;
  // El tamaño se ajusta al número de posiciones: con pocas, un mapa compacto.
  const W=400, H = n<=2 ? 130 : n===3 ? 230 : n<=5 ? 280 : 320;
  // El radio deja sitio al nodo más ancho para que ninguno se salga por los lados.
  const hw = p => Math.min(136, p.length*7.7+22)/2, mw = Math.max(...nodes.map(hw));
  const cx=W/2, cy = n<=2 ? H/2+12 : H/2+14, rx = Math.min(n<=2 ? 120 : 138, W/2-mw-4), ry = n<=2 ? 0 : (H/2 - 48);
  const P={};
  nodes.forEach((p,i)=>{ const a = n<=2 ? Math.PI*(1-i) : -Math.PI/2+2*Math.PI*i/n; P[p]={x:cx+rx*Math.cos(a), y:cy+ry*Math.sin(a), w:hw(p), h:16}; });
  const E={};
  figs().filter(f=>active(f)&&placed(f)&&P[f.entrada]&&P[f.salida]).forEach(f=>{
    const k=f.entrada+"␟"+f.salida; const e=E[k]||(E[k]={a:f.entrada,b:f.salida,n:0,r:0}); e.n++; if(ready(f)) e.r++;
  });
  const gaps = new Set(cov.filter(c=>c.into.length && c.ready.length<2).map(c=>c.p));
  const f1 = v=>Math.round(v*10)/10;
  const edge = e=>{
    const A=P[e.a], B=P[e.b], cls=e.r?"g-ready":"g-prac", mk=`url(#g-arr-${e.r?"r":"p"})`, lbl=e.n>1?e.n:"";
    if(e.a===e.b){
      const x=A.x+A.w-18, y=A.y-A.h;   // el bucle va al extremo derecho, lejos de las flechas que entran por el centro
      return `<path class="g-edge ${cls}" d="M${f1(x-12)},${f1(y)} C${f1(x-26)},${f1(y-30)} ${f1(x+26)},${f1(y-30)} ${f1(x+12)},${f1(y-1)}" marker-end="${mk}"/>${lbl?`<text class="g-lbl" x="${f1(x)}" y="${f1(y-26)}" text-anchor="middle">${lbl}</text>`:""}`;
    }
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    const off = E[e.b+"␟"+e.a] ? 5 : 0, nx=-uy*off, ny=ux*off;
    const cut = N => Math.min(N.w/Math.max(Math.abs(ux),1e-6), N.h/Math.max(Math.abs(uy),1e-6));
    const sA=cut(A)+3, sB=cut(B)+5;
    const x1=A.x+ux*sA+nx, y1=A.y+uy*sA+ny, x2=B.x-ux*sB+nx, y2=B.y-uy*sB+ny;
    const mx=(x1+x2)/2 - uy*(off?11:9), my=(y1+y2)/2 + ux*(off?11:9);
    return `<line class="g-edge ${cls}" x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" marker-end="${mk}"/>${lbl?`<text class="g-lbl" x="${f1(mx)}" y="${f1(my+4)}" text-anchor="middle">${lbl}</text>`:""}`;
  };
  const node = p=>{ const N=P[p];
    return `<g class="g-node${p===linkPos?" g-sel":""}${gaps.has(p)?" g-gap":""}" data-pos="${esc(p)}"><rect x="${f1(N.x-N.w)}" y="${f1(N.y-N.h)}" width="${f1(N.w*2)}" height="${N.h*2}" rx="${N.h}"/><text x="${f1(N.x)}" y="${f1(N.y+5)}" text-anchor="middle"${p.length>16?' class="long"':""}>${esc(p)}</text></g>`; };
  return `<figure class="graph">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de enlaces: cada flecha va de la posición donde empieza una figura activa a la posición donde acaba.">
      <defs>
        <marker id="g-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="g-head-r"/></marker>
        <marker id="g-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="g-head-p"/></marker>
      </defs>
      ${Object.values(E).map(edge).join("")}
      ${nodes.map(node).join("")}
    </svg>
    <figcaption><details class="info"><summary>Cómo leer el mapa</summary>Cada flecha es una figura activa; el número indica cuántas hay entre esas dos posiciones. Continua: disponible o consolidada. Discontinua: en práctica. Borde rojo: llegas ahí con menos de 2 salidas listas. Toca una posición para ver sus salidas.</details></figcaption>
  </figure>`;
}

const dayOf = ts => { const d=new Date(ts||Date.now()); d.setHours(12,0,0,0); return d.toISOString().slice(0,10); };
function stateAt(f, dEnd){
  if(dayOf(f.creado) > dEnd) return null;
  const h=f.hist;
  if(!h || !h.length) return f.estado;
  let e=null; for(const x of h){ if(x.d<=dEnd) e=x.e; }
  return e || h[0].e;
}
let progWeek = null;
function progressHTML(){
  const all = figs(); if(!all.length) return "";
  const now=new Date(); now.setHours(12,0,0,0);
  const monday=new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7));
  const weeks=[];
  for(let i=7;i>=0;i--){
    const s=new Date(monday); s.setDate(monday.getDate()-7*i);
    const e=new Date(s); e.setDate(s.getDate()+6);
    const end = i===0 ? todayStr() : e.toISOString().slice(0,10);
    const c={espera:0,practica:0,disponible:0,consolidada:0};
    all.forEach(f=>{ const st=stateAt(f,end); if(st) c[st]++; });
    const soc = Object.values(S.logs).filter(l=>l.fecha>=s.toISOString().slice(0,10) && l.fecha<=end).length;
    weeks.push({label:s.toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(".",""), c, ready:c.disponible+c.consolidada, soc, cur:i===0});
  }
  const max = Math.max(4, ...weeks.map(w=>w.ready));
  const step = max<=8 ? 2 : max<=20 ? 5 : 10, top = Math.ceil(max/step)*step;
  const W=360, H=190, L=26, R=6, T=10, B=26, pw=W-L-R, ph=H-T-B, bw=pw/weeks.length;
  const y = v => T + ph - v/top*ph;
  const sel = progWeek==null ? weeks.length-1 : progWeek;
  const ticks=[]; for(let v=0; v<=top; v+=step) ticks.push(v);
  const barPath=(x,w,v)=>{ if(!v) return ""; const yt=y(v), yb=y(0), r=Math.min(4,(yb-yt)/2,w/2);
    return `M${x},${yb} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+w-r} Q${x+w},${yt} ${x+w},${yt+r} V${yb} Z`; };
  const first=weeks[0].ready, last=weeks[weeks.length-1].ready, w=weeks[sel];
  return `<div class="panel">
    <h3>Tu progreso</h3>
    <p><b style="font-family:var(--f-display);font-size:22px">${last}</b> listas para el social <span class="muted small">(${first===last?"igual que":(last>first?"+"+(last-first)+" respecto a":(last-first)+" respecto a")} hace 8 semanas)</span></p>
    <figure class="chart">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Figuras disponibles o consolidadas al final de cada una de las últimas 8 semanas.">
        ${ticks.map(v=>`<line class="c-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="c-ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
        ${weeks.map((wk,i)=>{ const x=L+i*bw+bw*0.2, bwid=bw*0.6;
          return `<path class="c-bar${i===sel?" c-sel":""}" d="${barPath(x,bwid,wk.ready)}"/>
            <text class="c-ax" x="${x+bwid/2}" y="${H-8}" text-anchor="middle">${esc(wk.label)}</text>
            <rect class="c-hit" data-week="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${ph+B}"/>`; }).join("")}
      </svg>
      <figcaption class="small" id="prog-read">Semana del ${esc(w.label)}${w.cur?" (en curso)":""}: <b>${w.c.consolidada}</b> consolidadas · <b>${w.c.disponible}</b> disponibles · ${w.c.practica} en práctica · ${w.c.espera} en espera · ${w.soc} ${w.soc===1?"social":"socials"} registrados</figcaption>
    </figure>
    <details><summary>Ver datos</summary><div style="overflow-x:auto"><table class="dtab"><thead><tr><th>Semana</th><th>Listas</th><th>Práctica</th><th>Espera</th><th>Socials</th></tr></thead>
      <tbody>${weeks.map(wk=>`<tr><td>${esc(wk.label)}</td><td>${wk.ready}</td><td>${wk.c.practica}</td><td>${wk.c.espera}</td><td>${wk.soc}</td></tr>`).join("")}</tbody></table></div></details>
    <p class="small muted">Cada barra cuenta las figuras disponibles o consolidadas al final de la semana. El historial de estados se guarda desde esta versión; para lo anterior se usa el estado actual de cada figura desde que la creaste.</p>
  </div>`;
}

function renameItem(kind, i, nw){
  const L=LISTS[kind], list=S[L.key], old=list[i];

    if(kind==="pos"){ if(f.entrada===old){f.entrada=nw;ch=true;} if(f.salida===old){f.salida=nw;ch=true;} }
    if(kind==="hold"){ if(f.agarreIn===old){f.agarreIn=nw;ch=true;} if(f.agarreOut===old){f.agarreOut=nw;ch=true;} }
    if(kind==="cls" && f.profesor===old){ f.profesor=nw; ch=true; }
    if(ch) persist({t:"fig",id:f.id});
  });
  if(kind==="pos"){
    Object.values(S.logs).forEach(l=>{ if(l.bloqueo===old){ l.bloqueo=nw; persist({t:"log",id:l.id}); } });
    if(S.linkRep[old]){ S.linkRep[nw]=S.linkRep[old]; delete S.linkRep[old]; persist({t:"lr"}); }

function importData(replace){
  let d; try{ d=JSON.parse($("#imp-text").value); }catch{ toast("El JSON no es válido. Pega el contenido completo exportado."); return; }
  if(!d || typeof d.figures!=="object"){ toast("Ese archivo no es una copia de Bachateca."); return; }
  if(replace){
    Object.keys(S.figures).forEach(id=>{ if(!d.figures[id]) deleteFigure(id); });
    Object.keys(S.logs).forEach(id=>{ if(!(d.logs||{})[id]){ delete S.logs[id]; persist({t:"logdel",id}); } });
  }
  Object.values(d.figures).forEach(f=>{ if(f&&f.id&&f.nombre){ S.figures[f.id]=f; persist({t:"fig",id:f.id}); } });
  Object.values(d.logs||{}).forEach(l=>{ if(l&&l.id){ S.logs[l.id]=l; persist({t:"log",id:l.id}); } });
  const merge=(cur,inc)=> Array.isArray(inc)&&inc.length ? (replace ? [...inc] : [...new Set([...cur,...inc])]) : cur;

  }
  if(a==="import-merge") return importData(false);
  if(a==="import-replace"){ if(confirmKey!=="replace"){ const keep=$("#imp-text").value; confirmKey="replace"; openSettings(); $("#imp-text").value=keep; return; } return importData(true); }
});
document.addEventListener("mouseover", e=>{ const wk=e.target.closest && e.target.closest("[data-week]"); if(wk && +wk.dataset.week!==progWeek){ progWeek=+wk.dataset.week; render(); } });
// Arrastrar la hoja hacia abajo para cerrarla (cuando está arriba del todo).
(()=>{
  let sh=null, y0=0, x0=0, dy=0, t0=0, active=false, decided=false;
  document.addEventListener("touchstart", e=>{
    const el=e.target.closest && e.target.closest(".sheet"); if(!el || busy) return;
    if(el.scrollTop>0 && !e.target.closest(".sheet-head")) return;
    if(e.target.closest("input,textarea,select,video,.chips.scroll")) return;
    sh=el; y0=e.touches[0].clientY; x0=e.touches[0].clientX; dy=0; t0=Date.now(); active=false; decided=false;
  }, {passive:true});
  document.addEventListener("touchmove", e=>{
    if(!sh) return;
    const y=e.touches[0].clientY, x=e.touches[0].clientX; dy=y-y0;
    if(!decided){ if(Math.abs(dy)<6 && Math.abs(x-x0)<6) return; decided=true; active = dy>0 && Math.abs(dy)>Math.abs(x-x0); if(!active){ sh=null; return; } sh.classList.add("dragging"); }
    if(active){ e.preventDefault(); sh.style.transform=`translateY(${Math.max(0,dy)}px)`; }
  }, {passive:false});
  document.addEventListener("touchend", ()=>{
    if(!sh) return; const el=sh; sh=null; el.classList.remove("dragging");
    if(!active) return;
    const fast = dy>60 && (Date.now()-t0)<250;
    const dismiss = (dy>120 || fast) && !sheetDirty();
    if(dismiss){ el.classList.add("snap"); el.style.transform="translateY(100%)"; setTimeout(()=>{ confirmKey=null; editKey=null; closeSheet(); }, 200); }
    else { el.classList.add("snap"); el.style.transform=""; setTimeout(()=>el.classList.remove("snap"), 260); if(dy>120 || fast) requestClose(); }
  });
})();
document.addEventListener("keydown", e=>{
  if(confirmDone){
    if(e.key==="Escape"){ e.preventDefault(); confirmDone(false); }
    else if(e.key==="Tab"){ const bs=[...document.querySelectorAll("#confirm-root button")], i=bs.indexOf(document.activeElement); e.preventDefault(); bs[(i+(e.shiftKey?bs.length-1:1))%bs.length].focus(); }
    return;
  }
  if(e.key==="Escape"){ if($("#overlay-root").innerHTML) $("#overlay-root").innerHTML=""; else requestClose(); }
});
// Con una hoja o el panel de bloqueo abiertos, el resto de la app queda inerte (VoiceOver no se sale).
// Al abrir, el foco va al título de la hoja; al cerrar, vuelve a donde estaba.
let focusBack = null;
const outsideModal = el => !el.closest("#sheet-root,#overlay-root,#confirm-root");
document.addEventListener("focusin", e=>{ if(outsideModal(e.target)) focusBack=e.target; });
document.addEventListener("click", e=>{ const b=e.target.closest && e.target.closest("button,a"); if(b && outsideModal(b)) focusBack=b; }, true);
function syncModal(){
  const open = !!($("#sheet-root").firstElementChild || $("#overlay-root").firstElementChild);
  const was = $(".wrap").inert;
  $(".wrap").inert = open; $("nav.tabs").inert = open;
  if(open && !was){ const s=$("#sheet-root .sheet"); if(s && !s.contains(document.activeElement)) $("#sheet-t")?.focus({preventScroll:true}); }
  if(!open && was && focusBack && focusBack.isConnected) focusBack.focus({preventScroll:true});
}
const modalObs = new MutationObserver(syncModal);
modalObs.observe($("#sheet-root"), {childList:true}); modalObs.observe($("#overlay-root"), {childList:true});
$("#confirm-root").addEventListener("click", e=>{
  const b=e.target.closest("[data-cf]"); if(!b || !confirmDone) return;
  if(b.classList.contains("confirm-bg") && e.target!==b) return;
  confirmDone(b.dataset.cf==="ok");
});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && (tab==="social"||busy)) askWake(); });
$("#btn-new").onclick=()=>openFigure(null,{quick:true});
$("#btn-settings").onclick=()=>{ confirmKey=null; editKey=null; openSettings(); };

// arranque
const h=(location.hash||"").slice(1);
go(TABS.includes(h)?h:"repertorio");
initStore();
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")){
  // Busca actualizaciones al abrir y recarga una vez cuando llega una versión nueva.
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  // Si hay una hoja abierta, espera a que se cierre para no perder lo que se está escribiendo.
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(!hadController || reloaded) return; reloaded = true; if($(".sheet") || busy) pendingReload = true; else location.reload(); });
  navigator.serviceWorker.register("sw.js").then(r=>{ try{ r.update(); }catch{} }).catch(()=>{});
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") navigator.serviceWorker.getRegistration().then(r=>r && r.update()).catch(()=>{}); });
}
})();
</script>
