  toast("Ejemplos cargados. Puedes quitarlos en Ajustes.");
}

// ---------- render ----------
// Al repintar una vista, el foco vuelve al mismo control para que VoiceOver no salte al principio.
const FOCUS_ATTRS = ["data-sal","data-pos","data-hold","data-vista","data-lview","data-view","data-act","data-promote"];
function focusKey(el){
  if(!el || el===document.body) return null;
  if(el.id) return "#"+CSS.escape(el.id);
  const a = FOCUS_ATTRS.find(k=>el.hasAttribute(k));
  return a ? `[${a}="${CSS.escape(el.getAttribute(a))}"]` : null;
}
let focusAfter = null;
function render(){
  const view = $("#v-"+tab), ae = document.activeElement;
  const fk = focusAfter || (view && view.contains(ae) && focusKey(ae)); focusAfter = null;
  paintNight();   // marcar o desmarcar cambia si el social sigue en curso
  const due = dueFigs().length + dueLinks().length;
  const b=$("#due-badge"); b.textContent=due; b.hidden=!due; b.closest("button").setAttribute("aria-label", due ? `Repasar, ${due} pendientes` : "Repasar");
  if(!loaded){ $("#v-"+tab).innerHTML=`<p class="muted">Cargando tu repertorio…</p>`; return; }
  if(tab==="inicio") renderInicio();
  else if(tab==="repertorio") renderRepertorio();
  else if(tab==="repasar") renderRepasar();
  else if(tab==="enlazar") renderEnlazar();
  else if(tab==="social") renderSocial();
  hydrateVideos($("#v-"+tab));
  justSaved = null; lastSal = null;
  if(fk && !$("#sheet-root .sheet") && !$("#overlay-root").firstElementChild){ const el=$("#v-"+tab).querySelector(fk); if(el && el!==document.activeElement) el.focus({preventScroll:true}); }
}

// ---------- eventos ----------
document.addEventListener("click", async e=>{
  const pc = e.target.closest("[data-speed],[data-mirror],[data-loopbtn]");
  if(pc){
    const pl=pc.closest(".player"), v=pl && pl.querySelector("video"); if(!v) return;
    if(pc.dataset.speed){ v.playbackRate=+pc.dataset.speed; pl.querySelectorAll("[data-speed]").forEach(b=>b.setAttribute("aria-pressed", b===pc)); }
    else if(pc.hasAttribute("data-mirror")){ const on=!v.classList.contains("mirror"); v.classList.toggle("mirror",on); pc.setAttribute("aria-pressed",on); }
    else { const on=pl.dataset.loop!=="1"; pl.dataset.loop=on?"1":"0"; pc.setAttribute("aria-pressed",on); }
    return;
  }
  const wk = e.target.closest("[data-week]");
  if(wk){ progWeek=+wk.dataset.week; return render(); }
  const pk = e.target.closest("[data-pick]");
  if(pk){ $("#"+pk.dataset.pick)?.click(); return; }
  const t = e.target.closest("[data-tab],[data-act],[data-view],[data-edit],[data-grade],[data-pos],[data-hold],[data-vista],[data-promote],[data-dellog],[data-logfig],[data-lren],[data-lsave],[data-lcancel],[data-lmv],[data-ldel],[data-ladd],[data-sal],[data-bpos],[data-bhold],[data-bexit],[data-setv],[data-lview],[data-mins],[data-tema]");
  if(!t) return;
  if(t.closest(".view")) focusAfter = focusKey(t);
  const d=t.dataset;
  if(d.sal){ logSel.has(d.sal) ? logSel.delete(d.sal) : logSel.add(d.sal); lastSal=d.sal; saveSel(); return render(); }
  if(d.setv) return setGo(d.setv);
  if(d.tema){ setTema(d.tema); return openSettings(); }
  if(d.bpos!==undefined){ blockPos=d.bpos; blockHold=null; blockPick=null; return showBlock("#bk-from"); }
  if(d.bhold!==undefined){ blockHold = blockHold===d.bhold ? null : d.bhold; return showBlock(`[data-bhold="${CSS.escape(d.bhold)}"]`); }
  if(d.bexit){ blockPick=d.bexit; return showBlock("#bk-from"); }
  if(d.tab) return go(d.tab);
  if(d.view) return openView(d.view);
  if(d.edit) return openFigure(d.edit, {fromView: !!t.closest("[data-viewfig]")});
  if(d.grade) return grade(d.grade);
  if(d.lview){ linkView=d.lview; return render(); }
  if(d.pos!==undefined && !t.closest("form")){ learn("pos"); linkPos=d.pos; linkHold=""; chain=null;
    if(t.closest(".graph")){ linkView="aqui"; render(); return window.scrollTo(0,0); }   // del mapa a las salidas de esa posición
    return render(); }
  if(d.hold!==undefined){ linkHold=d.hold; return render(); }
  if(d.vista){ filt.vista=d.vista; return render(); }
  if(d.promote){
    const f=S.figures[d.promote] ? clone(S.figures[d.promote]) : null; const to=d.to||"disponible";
    // Sin dónde empieza o acaba no sale de la lista de espera: se abre la ficha con lo que falta señalado.
    if(f && incomplete(f) && to!=="espera"){
      openFigure(f.id, {fromView: !!t.closest("[data-viewfig]"), estado:to});
      const fin=$("#ff-in"), fout=$("#ff-out");
      if(fin) fieldError([!f.entrada && fin, !f.salida && fout].filter(Boolean), fin.closest(".grid2"), `Para ${to==="practica"?"empezar a practicarla":"pasarla a "+EST[to].t.toLowerCase()} indica dónde empieza y dónde acaba.`);
      return;
    }
    if(f){ f.estado=to; saveFigure(f); toast(`«${f.nombre}» pasa a ${EST[to].t.toLowerCase()}`); if($('[data-sheet="log"]')) openLog(); else if($("#sheet-root [data-viewfig]")) openView(f.id); else t.remove(); }
    return;
  }
  if(d.logfig){ logSel.has(d.logfig) ? logSel.delete(d.logfig) : logSel.add(d.logfig); t.setAttribute("aria-pressed", logSel.has(d.logfig)); saveSel(); render(); return; }
  if(d.dellog) return deleteLog(d.dellog);
  if(d.lren){ editKey=d.lren+d.i; confirmKey=null; return openSettings(); }
  if(d.lcancel){ editKey=null; return openSettings(); }
  if(d.lsave){ const k=d.lsave+d.i; const inp=$("#ren-"+k); if(renameItem(d.lsave, +d.i, inp.value.trim())){ editKey=null; openSettings(); } return; }
  if(d.lmv){ const a=S[LISTS[d.lmv].key], i=+d.i; [a[i-1],a[i]]=[a[i],a[i-1]]; saveMeta(); return openSettings(); }
  if(d.ldel){ const k="del"+d.ldel+d.i; if(confirmKey!==k){ confirmKey=k; return openSettings(); } confirmKey=null; S[LISTS[d.ldel].key].splice(+d.i,1); saveMeta(); return openSettings(); }
  if(d.ladd){ const inp=$("#new-"+d.ladd), v=inp.value.trim(), a=S[LISTS[d.ladd].key]; if(!v) return; if(a.includes(v)){ toast("Ya está en la lista."); return; } a.push(v); saveMeta(); return openSettings(); }
  const a=d.act;
  if(a==="close-bg"){ if(e.target===t) requestClose(); return; }
  if(a==="close") return requestClose();
  if(a==="quick") return openFigure(null,{quick:true});
  if(a==="full") return openFigure();
  if(a==="examples"){ closeSheet(); return loadExamples(); }
  if(a==="clear-examples"){ figs().filter(f=>f.ejemplo).forEach(f=>deleteFigure(f.id)); toast("Ejemplos quitados"); return openSettings(); }
  if(a==="coach"){ learn("coach"); return runCoach(); }
  if(a==="clear-filt"){ filt.q=""; filt.baile="todos"; filt.estado="todos"; return render(); }
  if(a==="start-fig") return startSession("fig", false);
  if(a==="start-fig-any") return startSession("fig", true);
  if(a==="start-link") return startSession("link", false);
  if(a==="start-link-any") return startSession("link", true);
  if(a==="reveal"){ session.revealed=true; render(); const an=$("#v-repasar .answer"); if(an){ an.tabIndex=-1; an.focus({preventScroll:true}); } return; }
  if(a==="end"){ const wasTrain=!!training; session=null; training=null; if(wasTrain) return go("inicio"); return render(); }
  if(a==="train-start") return startTraining();
  if(a==="train-next"){ training.i++; return runTrainingStep(); }
  if(d.mins){ trainMins=+d.mins; lsSet(LS_MINS, trainMins); return render(); }
  if(a==="goto-pos"){ linkPos=d.p; linkHold=""; linkView="aqui"; chain=null; return go("enlazar"); }
  if(a==="goto-filter"){ filt.estado=d.f; filt.q=""; return go("repertorio"); }
  if(a==="chain"){ learn("chain"); chain=makeChain(linkPos); return render(); }
  if(a==="block"){ blockPos=null; blockHold=null; blockPick=null; return showBlock(); }
  if(a==="bexit-back"){ const id=blockPick; blockPick=null; blockHold=null; return showBlock(`[data-bexit="${CSS.escape(id||"")}"]`); }
  if(a==="bexit-done"){
    const id=blockPick, had=logSel.has(id), f=S.figures[id]; if(!f) return closeBlock();
    logSel.add(id); lastSal=id; logBloq=blockPos; saveSel(); blockPos=null; blockHold=null; blockPick=null; $("#overlay-root").innerHTML=""; render();
    return toast(f?`«${f.nombre}» marcada para el registro`:"Marcada para el registro", had?null:{label:"Deshacer", fn:()=>{ logSel.delete(id); saveSel(); render(); }});
  }
  if(a==="bk-tap") return bkTap();
  if(a==="unblock") return closeBlock();
  if(a==="set-back"){ if(sheetDirty() && !(await askConfirm({title:"¿Descartar los cambios?", msg:"Lo que has escrito en esta pantalla no se ha guardado.", ok:"Descartar cambios", cancel:"Seguir editando"}))) return; return setGo(null); }
  if(a==="night-off"){
    setNight(false); releaseWake();
    if(tab==="social") go("repertorio"); else render();
    return toast(logSel.size || logBloq ? "Social terminado. Lo que marcaste sigue en Social para registrarlo." : "Social terminado.");
  }
  if(a==="bpos-back"){ blockPos=null; blockHold=null; blockPick=null; return showBlock("#bk-where"); }
  if(a==="log-open"){ logSuggest=[]; confirmKey=null; return openLog(true); }
  if(a==="stale-log"){ logSuggest=[]; confirmKey=null; return openLog(true); }
  if(a==="stale-drop"){
    const prev={ids:[...logSel], bloq:logBloq, d:salD};
    logSel=new Set(); logBloq=""; saveSel(); render();
    return toast("Marcas descartadas", {label:"Deshacer", fn:()=>{ logSel=new Set(prev.ids); logBloq=prev.bloq; salD=prev.d; saveSel(); render(); }});
  }
  if(a==="nudge-off"){ lsSet(LS_NUDGE, 0); return render(); }
  if(a==="log-save") return saveLog();
  if(a==="log-again"){ logDone=null; logSuggest=[]; return openLog(true); }
  if(a==="log-all"){ logAll=true; openLog(); return ($("#lg-q") || $("#lg-chips .chip:not([aria-pressed=true])"))?.focus(); }
  if(a==="del-fig"){
    const id=d.id, f=S.figures[id]; if(!f) return;
    const ok = await askConfirm({title:`¿Borrar «${f.nombre}»?`, msg: f.vid ? "También se borra su vídeo guardado en la app. Tendrás unos segundos para deshacerlo." : "Tendrás unos segundos para deshacerlo.", ok:"Borrar figura"});
    if(!ok) return;
    closeSheet(); deleteFigureUndo(id); return;
  }
  if(a==="export") return exportBackup();
  if(a==="save-vids") return saveVidBatch();
  if(a==="persist"){
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok=>{ toast(ok?"Datos protegidos":"El sistema no lo ha permitido. Instala la app en la pantalla de inicio y vuelve a probar."); openSettings(); });
    else toast("Este navegador no lo permite.");
    return;
  }
  if(a==="install-hide"){ lsSet("bachateca.install.hide", true); return render(); }
  if(a==="ai-share") return shareCapture();
  if(a==="ai-apply"){ const t=$("#ai-paste")?.value||""; if(!t.trim()){ toast("Pega primero la respuesta de Claude."); return; } return applySuggestion(cleanSug(parseReply(t))); }
  if(a==="copy"){
    const txt=exportData();
    try{ await navigator.clipboard.writeText(txt); lsSet(BK_AT, Date.now()); lsSet(BK_CH, 0); lsSet(LS_NUDGE, 0); toast("Copiado. Pégalo en Notas o donde lo quieras guardar."); openSettings(); }
    catch{ const ta=$("#exp-text"); ta.hidden=false; ta.value=txt; ta.focus(); ta.select(); toast("No se pudo copiar solo. Mantén pulsado el recuadro y elige Copiar."); }
    return;
  }
  if(a==="import-merge") return importData(false);
  if(a==="import-replace") return importData(true);
});
document.addEventListener("mouseover", e=>{ const wk=e.target.closest && e.target.closest("[data-week]"); if(wk && +wk.dataset.week!==progWeek){ progWeek=+wk.dataset.week; render(); } });
// Arrastrar la hoja hacia abajo para cerrarla (cuando está arriba del todo).
(()=>{
  let sh=null, y0=0, x0=0, dy=0, t0=0, active=false, decided=false;
  document.addEventListener("touchstart", e=>{
    const el=e.target.closest && e.target.closest(".sheet"); if(!el || busy) return;
    if(el.scrollTop>0 && !e.target.closest(".sheet-head")) return;
    if(e.target.closest("input,textarea,select,video,.chips.scroll")) return;
    sh=el; y0=e.touches[0].clientY; x0=e.touches[0].clientX; dy=0; t0=Date.now(); active=false; decided=false;
  }, {passive:true});
  document.addEventListener("touchmove", e=>{
    if(!sh) return;
    const y=e.touches[0].clientY, x=e.touches[0].clientX; dy=y-y0;
    if(!decided){ if(Math.abs(dy)<6 && Math.abs(x-x0)<6) return; decided=true; active = dy>0 && Math.abs(dy)>Math.abs(x-x0); if(!active){ sh=null; return; } sh.classList.add("dragging"); }
    if(active){ e.preventDefault(); sh.style.transform=`translateY(${Math.max(0,dy)}px)`; }
  }, {passive:false});
  document.addEventListener("touchend", ()=>{
    if(!sh) return; const el=sh; sh=null; el.classList.remove("dragging");
    if(!active) return;
    const fast = dy>60 && (Date.now()-t0)<250;
    const dismiss = (dy>120 || fast) && !sheetDirty();
    if(dismiss){ el.classList.add("snap"); el.style.transform="translateY(100%)"; setTimeout(()=>{ confirmKey=null; editKey=null; closeSheet(); }, 200); }
    else { el.classList.add("snap"); el.style.transform=""; setTimeout(()=>el.classList.remove("snap"), 260); if(dy>120 || fast) requestClose(); }
  });
})();
document.addEventListener("keydown", e=>{
  if(confirmDone){
    if(e.key==="Escape"){ e.preventDefault(); confirmDone(false); }
    else if(e.key==="Tab"){ const bs=[...document.querySelectorAll("#confirm-root button")], i=bs.indexOf(document.activeElement); e.preventDefault(); bs[(i+(e.shiftKey?bs.length-1:1))%bs.length].focus(); }
    return;
  }
  if(e.key==="Escape"){ if($("#overlay-root").innerHTML) closeBlock(); else requestClose(); }
});
// Con una hoja o el panel de bloqueo abiertos, el resto de la app queda inerte (VoiceOver no se sale).
// Al abrir, el foco va al título de la hoja; al cerrar, vuelve a donde estaba.
// Si al cerrar la pantalla se ha vuelto a pintar, el foco va a su equivalente nuevo; y nunca le quita el foco a «Deshacer».
let focusBack = null, focusBackKey = null;
const outsideModal = el => !el.closest("#sheet-root,#overlay-root,#confirm-root");
const setFocusBack = el => { focusBack=el; focusBackKey=focusKey(el); };
document.addEventListener("focusin", e=>{ if(outsideModal(e.target)) setFocusBack(e.target); });
document.addEventListener("click", e=>{ const b=e.target.closest && e.target.closest("button,a"); if(b && outsideModal(b)) setFocusBack(b); }, true);
function syncModal(){
  const open = !!($("#sheet-root").firstElementChild || $("#overlay-root").firstElementChild);
  const was = $(".wrap").inert;
  $(".wrap").inert = open; $("nav.tabs").inert = open;
  const s=$("#sheet-root .sheet");
  if(open && s && !s.contains(document.activeElement) && (!was || document.activeElement===document.body)) $("#sheet-t")?.focus({preventScroll:true});
  const ae=document.activeElement, lost = !ae || ae===document.body || !ae.isConnected;
  if(!open && was && lost){ const el = focusBack && focusBack.isConnected ? focusBack : focusBackKey && $(`#v-${tab}`)?.querySelector(focusBackKey); el?.focus({preventScroll:true}); }
}
const modalObs = new MutationObserver(syncModal);
modalObs.observe($("#sheet-root"), {childList:true}); modalObs.observe($("#overlay-root"), {childList:true});
$("#confirm-root").addEventListener("click", e=>{
  const b=e.target.closest("[data-cf]"); if(!b || !confirmDone) return;
  if(b.classList.contains("confirm-bg") && e.target!==b) return;
  confirmDone(b.dataset.cf==="ok");
});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState!=="visible") return; paintNight(); if(tab==="social"||busy||socialLive()) askWake(); });
$("#btn-new").onclick=()=>openFigure(null,{quick:true});
$("#btn-settings").onclick=()=>{ setView=null; confirmKey=null; editKey=null; openSettings(); };

// Solo para las pruebas automáticas (tests/): abre la app con ?test para usar estas funciones desde fuera.
if(/[?&]test(&|=|$)/.test(location.search)) window.__bachateca = {
  SCHEMA, migrate, nextRep, holdOk, canFollow, exitsFrom, makeChain, todayStr, vidsUnsaved, markVidSaved, exportData,
  state: ()=>S, ready: ()=>loaded, flush: ()=>saveNow(), setFigs: o=>{ S.figures=o; render(); }
};

// arranque
const h=(location.hash||"").slice(1);
go(TABS.includes(h)?h:"inicio");
initStore();
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")){
  // Busca actualizaciones al abrir y recarga una vez cuando llega una versión nueva.
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  // Si hay una hoja abierta, espera a que se cierre para no perder lo que se está escribiendo.
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(!hadController || reloaded) return; reloaded = true; if($(".sheet") || busy) pendingReload = true; else location.reload(); });
  navigator.serviceWorker.register("sw.js").then(r=>{ try{ r.update(); }catch{} }).catch(()=>{});
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") navigator.serviceWorker.getRegistration().then(r=>r && r.update()).catch(()=>{}); });
}
})();
</script>
